{% extends "base.html" %}

{% block title %}Add Employee - StaffHub{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    <a href="/" class="text-blue-600 text-sm font-medium hover:underline mb-4 inline-block">&larr; Back to Directory</a>
    
    <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Register New Employee</h1>
    <p class="text-gray-600 text-sm mb-6">Fill in the employee details and upload a profile photo.</p>

    <!-- Form requires enctype="multipart/form-data" for file uploads -->
    <form action="/employees/new" method="POST" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
            <input type="text" name="name" required placeholder="e.g., John Smith" 
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="john.smith@company.com" 
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Department</label>
            <select name="department" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                <option value="Engineering">Engineering</option>
                <option value="Product">Product</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="HR">HR</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Profile Picture</label>
            <input type="file" name="profile_pic" accept="image/*" 
                   class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-xl">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 transition shadow-sm mt-4">
            Save Employee
        </button>
    </form>
</div>
{% endblock %}
